# ===========================================================================
# 99-airymax.conf — AirymaxOS 桌面形态的 NetworkManager 全局策略
#
# 安装路径 /etc/NetworkManager/conf.d/99-airymax.conf。NetworkManager 按文件
# 名字典序合并 conf.d，99 排在最后，因此这里写的键就是生效值，而不是被上
# 游片段覆盖的建议值。
#
# 为什么需要这一份：装机验收的第一道判据是「首启 60s 内 Wi-Fi 或有线至少
# 一路 DHCP 成功且网关可达」。这条判据依赖两件事——设备被默认为受管，以
# 及地址变化能被立刻观测到。服务器档的 no-auto-default/ignore-carrier 会
# 同时破坏这两件事，所以镜像里不再安装该档；桌面形态把策略写在明处，换
# 一台机器、换一版上游包，行为都不随默认值漂移。
#
# 只写会改变行为的三组键，不复制上游默认值：
#   [main] dns/rc-manager
#     由 NetworkManager 自己写 resolv.conf（symlink 指向 /run 下的运行时
#     文件）。不用 dnsmasq/resolvconf 插件：镜像未安装它们，插件在运行期
#     解析不到就会退化成「不写 resolv.conf」，表现是能拿到地址但域名全
#     不可解析——这正是 0.0.3 现场最难归因的一类故障。
#   [connectivity] enabled=false
#     隔离内网、无外网机房与首次联网前的设备都会被探测判为 limited，触发
#     周期性重连和日志噪音，且在装机脚本里看起来像「网络不通」。验收判据
#     只看地址、路由与网关可达，不看外网探测结果。
# ===========================================================================

[main]
dns=default
rc-manager=symlink

[connectivity]
enabled=false
