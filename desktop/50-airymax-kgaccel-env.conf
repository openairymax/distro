# ===========================================================================
# 50-airymax-kgaccel-env.conf — 非 GUI Qt 守护进程不继承桌面平台主题
#
# 落点：/etc/systemd/user/plasma-kglobalaccel.service.d/50-airymax-kgaccel-env.conf
#
# 事实（285H，0.0.4-7）：kglobalaccel5 每个启动周期 SIGSEGV 一次，core 栈为
#
#   libQt5Core  QGSettings::changed
#   qt5-ukui-platformtheme  libqt5-ukui-platformtheme.so（字体变更回调）
#   libQt5Widgets  QApplication::setFont(QFont const&, char const*)
#
# kglobalaccel5 只有 QCoreApplication，没有 QApplication。插件按
# QT_QPA_PLATFORMTHEME=ukui 被加载后注册 QGSettings 字体监听，字体一变就
# 对空实例调用 QApplication::setFont，解引用空指针。变量本身是图形会话的
# 属性（ukui-session 在会话启动时写入），却因为进入 systemd 用户管理器
# 环境而被用户单元集体继承——非 GUI 守护进程没有任何理由加载平台主题。
#
# 因此这里只针对该单元把变量摘掉，而不是绕过崩溃点：变量不进进程，
# 插件就不会被加载，回调也无从触发。GUI 应用由会话直接启动，环境不受
# 影响，主题观感不变。
#
# 插件自身的缺陷（对无 QApplication 的进程调用 QApplication::setFont）
# 属上游 qt5-ukui-platformtheme 3.1.4，按 distro/ukui-patches/README.md 的
# 三条件在 0.0.5 提上游或补丁，本项目内不以改二进制收尾。
# ===========================================================================

[Service]
UnsetEnvironment=QT_QPA_PLATFORMTHEME
