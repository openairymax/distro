# 50-airymax-desktop.conf — 桌面会话调度隔离
#
# 部署：airymaxos-release 包安装到 /etc/systemd/system/user@.service.d/。
# 作用：把整个用户会话（含 ukui-session、peony、应用）挂到
#       airymax-desktop.slice，使其相对 agent 负载处于低权重。
#
# slice 单元由同一软件包安装到 /usr/lib/systemd/system/，systemd 会按名字
# 自动创建父 slice，无需显式 Requires。
#
# 平台主题变量不在这里摘除：ukui-session 在启动后自行把它写进用户管理器
# 环境（285H 实测 `systemctl --user show-environment` 含该变量），用户管理
# 器启动时再摘除已经太晚，只有单元自身的 drop-in 才能挡住。见同目录外的
# desktop/50-airymax-no-qpa-theme.conf。
# ===========================================================================
[Service]
Slice=airymax-desktop.slice
