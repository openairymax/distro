# ===========================================================================
# 50-airymax-no-qpa-theme.conf — 非 GUI Qt 守护进程不继承桌面平台主题
#
# 落点：airymaxos-release 把同一份内容安装到 /etc/systemd/user 下每个非 GUI
#       Qt 守护进程的 *.service.d/ 目录，目前是
#       plasma-kglobalaccel.service（kglobalaccel5，QCoreApplication）与
#       plasma-kscreen.service（kscreen_backend_launcher，QGuiApplication）。
#
# 事实（285H 实测，重复 3 次）：执行 `sudo dconf update` 后，上述两个单元
# 各自 SIGSEGV 一次，core 栈为
#
#   libQt5Core  QGSettings::changed
#   qt5-ukui-platformtheme  libqt5-ukui-platformtheme.so（字体变更回调）
#   libQt5Widgets  QApplication::setFont(QFont const&, char const*)
#
# 两个进程都没有 QApplication。插件按 QT_QPA_PLATFORMTHEME=ukui 被加载后
# 注册 QGSettings 字体监听，系统字体一变就对非 QApplication 实例调用
# QApplication::setFont，解引用空指针。变量本身是图形会话的属性
# （ukui-session 启动后自行写入用户管理器环境，实测
# `systemctl --user show-environment` 含该变量），却因为进入用户管理器
# 环境而被用户单元集体继承——非 GUI 守护进程没有任何理由加载平台主题。
#
# 因此按单元把变量摘掉，而不是绕过崩溃点：变量不进进程，插件就不会被
# 加载，回调也无从触发。GUI 应用不经过用户管理器启动（ukui-session 由
# lightdm 以 --session-child 拉起，285H 实测 lightdm → ukui-session →
# ukui-kwin_x11 / ukui-panel），环境不受影响，主题观感不变。
#
# 不再写成「用户管理器一层摘除」：ukui-session 是在管理器启动之后写入该
# 变量的，user@.service 的 UnsetEnvironment 只能作用于管理器自身的启动
# 环境，管不住后写入的值。
#
# 插件自身的缺陷（对非 QApplication 进程调用 QApplication::setFont）属上游
# qt5-ukui-platformtheme 3.1.4，按 distro/ukui-patches/README.md 的三条件在
# 0.0.5 提上游或补丁，届时本文件随之一并删除。
# ===========================================================================

[Service]
UnsetEnvironment=QT_QPA_PLATFORMTHEME
