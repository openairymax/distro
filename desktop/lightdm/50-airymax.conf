# 50-airymax.conf — AirymaxOS lightdm 座位策略
#
# 部署：随 airymaxos-release 包安装到 /etc/lightdm/lightdm.conf.d/。
# 读取顺序：lightdm 先读 /usr/share/lightdm/lightdm.conf.d/*.conf（包自带
# 默认值），再读本目录，最后读 /etc/lightdm/lightdm.conf，故此处覆盖生效。
#
# 只固化发行版自有事实：默认会话为 UKUI。greeter 侧配置（greeter-session、
# greeter-setup-script）由 ukui-greeter 的 95-ukui-greeter.conf 声明，不在
# 此重复；座位类型沿用 lightdm 默认的 local（X11），不写 type=x。
#
# 显式声明 user-session 的目的：默认会话是发行版契约，不能因第三方
# greeter 包调整默认值而被动漂移。
#
# 免密进入桌面（0.0.3 决策）：交付口径是「开机即桌面」，座位以 airymax
# 自动登录，与 /etc/shadow 中该账户的空口令一致（%post 执行 passwd -d）。
# 自动登录只在本地座位生效，不影响 SSH 侧的账户策略。
# ===========================================================================
[Seat:*]
user-session=ukui
autologin-user=airymax
autologin-user-timeout=0
autologin-session=ukui
