# airy-session.conf — 引导期与运行期会话状态的公共配置
#
# 状态目录被选择器（U-09）、lightdm 与桌面就绪探针的 drop-in、运行期切换
# 单元（U-10）共同读取。写在一处，避免四处各写一个路径字面量后在某个
# drop-in 里读到旧目录。
#
# SSoT: 0.0.5 方案 §14.1、§14.15。
# ===========================================================================
AIRY_SESSION_DIR=/run/airymaxos/session
