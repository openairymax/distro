# ===========================================================================
# lightdm 的会话选择前置判据（U-09）
#
# 本次开机选了 TUI 时不让 lightdm 启动：桌面链路不该在 tty1 之外再起一套
# 会抢 GPU 与 VT 的会话。判据在 airy-session-cond.sh 里，这里只登记调用点。
#
# SSoT: 0.0.5 方案 §14.1。
# ===========================================================================
[Service]
ExecCondition=/usr/lib/airymaxos/desktop/airy-session-cond.sh gui lightdm.service
