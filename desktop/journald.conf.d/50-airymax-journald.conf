# 50-airymax-journald — 让启动期日志跨重启留存
#
# 部署：airymaxos-release 安装到 /etc/systemd/journald.conf.d/。
#
# 背景：openEuler 默认不创建 /var/log/journal，journald 的 Storage=auto
# 因此退化为 volatile——日志只活在本次启动，重启后 journalctl 只剩当
# 前一轮。装机验收与现场排障恰恰需要「上一次启动发生了什么」，而
# volatile 让这条唯一线索在重启瞬间消失（B50 实测 /var/log/journal
# 不存在，journalctl --list-boots 只有 IDX 0）。
#
# Storage=persistent 让 journald 自行创建 /var/log/journal，并按
# SystemMaxUse（默认为 /var 的 10%）封顶轮转，不需要额外的 tmpfiles
# 或安装期建目录：目录归属与容量上限都由 journald 自己负责。
# ===========================================================================

[Journal]
Storage=persistent
