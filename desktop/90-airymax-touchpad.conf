# ===========================================================================
# AirymaxOS 触控板驱动归属：libinput 独占，遗留 synaptics 驱动不得接管。
#
# 根因（285H 实测，ELAN06FA:00 04F3:3293）：
#   * 闭包内的 xorg-x11-drv-synaptics-legacy 是 ukui-settings-daemon 的硬依赖，
#     其 /usr/share/X11/xorg.conf.d/70-synaptics.conf 的 "touchpad catchall"
#     在文件名全局排序中晚于 40-libinput.conf，于是每个触控板都被遗留驱动
#     接管（Xorg.0.log: "Using input driver 'synaptics'"）。
#   * 该驱动自 2018 年起不再维护，面对 I2C-HID 多点触控板拿不到压力与指宽，
#     日志为 "invalid pressure range" / "does not report pressure, will use
#     touch data"，点击与手势判定因此不可用；而内核侧绑定完全正常
#     （/proc/bus/input/devices 有 event 节点），只看内核的验收项无法发现。
#   * ukui-settings-daemon 的 libmouse.so 同时支持两套驱动，libinput 分支会
#     按 gsettings 落实 Tapping/NaturalScrolling/DisableWhileTyping，切回
#     libinput 不损失控制中心能力。
#
# 处置：Xorg 的 InputClass 依次应用，后匹配者生效；本文件排在 70-synaptics.conf
# 之后，只把「当前驱动为 synaptics」的触控板改派 libinput。不按机型分支，
# 不删除 ukui-settings-daemon 的依赖，也不改上游源码。
# ===========================================================================
Section "InputClass"
    Identifier "airymax-touchpad-libinput"
    MatchIsTouchpad "on"
    MatchDriver "synaptics"
    Driver "libinput"
EndSection
