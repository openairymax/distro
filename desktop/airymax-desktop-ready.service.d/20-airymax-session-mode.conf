# ===========================================================================
# 桌面就绪后写 mode=gui（U-09）
#
# 前置判据与 lightdm 同一份：选了 TUI 时整个探针不运行。ExecStartPost 在
# 探针成功退出后执行，由 root 写 /run 下的会话状态；失败不阻断就绪记账
# （`-` 前缀），但会留一行 journal。
#
# SSoT: 0.0.5 方案 §14.1、§14.15。
# ===========================================================================
[Service]
ExecCondition=/usr/lib/airymaxos/desktop/airy-session-cond.sh gui airymax-desktop-ready.service
ExecStartPost=-+/usr/lib/airymaxos/desktop/airy-session-state gui
