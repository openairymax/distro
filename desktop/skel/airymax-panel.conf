[General]
__userfile__=true
panels=panel1

[calendar]
alignment=Left
type=calendar
version=old-calendar

[nightmode]
alignment=Left
type=nightmode

[panel1]
alignment=-1
animation-duration=100
desktop=0
hidable=false
lineCount=1
lockPanel=false
