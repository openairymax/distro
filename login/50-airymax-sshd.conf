# 50-airymax-sshd.conf — AirymaxOS SSH 登录策略
#
# 部署：随 airymaxos-release 包安装到 /etc/ssh/sshd_config.d/。
# 读取顺序：openssh-server 的 /etc/ssh/sshd_config 第 15 行即
#   Include /etc/ssh/sshd_config.d/*.conf
# sshd 对同一选项取首次出现的值，故本文件先于 sshd_config 正文生效。
#
# 免密口径（0.0.3 决策）：airymax 账户在 target 上无口令（%post 执行
# passwd -d），因此 SSH 必须显式允许空口令，否则 sshd 在认证前即以
# "Password authentication is disabled for empty passwords" 拒绝。
# PAM 侧已具备条件：/etc/pam.d/password-auth 的 pam_unix 带 nullok。
#
# 只放开「空口令是否可用」这一项，不改变认证方式集合：
#   - PasswordAuthentication 保持 yes（sshd_config 正文已是 yes）
#   - KbdInteractiveAuthentication 关闭，避免空口令在键盘交互路径上
#     被重复提示，认证失败原因也更干净
# ===========================================================================
PermitEmptyPasswords yes
KbdInteractiveAuthentication no
