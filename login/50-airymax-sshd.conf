# 50-airymax-sshd.conf — AirymaxOS SSH 登录策略
#
# 部署：随 airymaxos-release 包安装到 /etc/ssh/sshd_config.d/。
# 读取顺序：openssh-server 的 /etc/ssh/sshd_config 第 15 行即
#   Include /etc/ssh/sshd_config.d/*.conf
# sshd 对同一选项取首次出现的值，故本文件先于 sshd_config 正文生效。
#
# 免密口径（0.0.3 决策）：交付账户 amuser 在 target 上无口令（kickstart
# 的 %post 执行 passwd -d），因此必须显式 PermitEmptyPasswords yes，否则
# sshd 在认证前即以 "Password authentication is disabled for empty
# passwords" 拒绝。PAM 侧已具备条件：/etc/pam.d/password-auth 的 pam_unix
# 带 nullok。
#
# 口令认证只对 amuser 开放（release 6 决策，根因见
# docs-closed/agent-linux-dev/285H-现场诊断与电源热治理.md §8.6）：
#   - PermitEmptyPasswords yes 使 sshd 在每个连接上先以空口令走一次 PAM
#     的 "none" 探测。对有口令的账户这次探测必然失败，并被 pam_faillock
#     记为一次失败；而 PAM 栈里 pam_unix 是 sufficient，成功路径走不到
#     后面的 pam_faillock authsucc，计数只增不减。表现是「只做过公钥登录
#     的账户也会在数次连接后被锁定」——285H 上的 root 就是这样被锁的。
#   - 因此不关探测开关，而是不让该账户进入口令认证：全局关闭后 sshd 不再
#     对它调用 mm_auth_password，探测随之消失，PAM 栈保持发行版原样。
#   - amuser 的探测是空口令对空口令，PAM 判定成功，不产生失败计数，故对它
#     保留口令认证，安装器交付的远程入口不变。
#
# 取舍：root 在本镜像上只接受公钥登录，交付口令只在本地控制台可用。远程
# 接管由 amuser 承担（wheel 且 NOPASSWD sudo），落地路径与 0.0.4 一致。
# ===========================================================================
PermitEmptyPasswords yes
PasswordAuthentication no
KbdInteractiveAuthentication no

Match User amuser
    PasswordAuthentication yes
