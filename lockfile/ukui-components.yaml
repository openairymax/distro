# ===========================================================================
# ukui-components.yaml — UKUI 组件台账与基底实测 NVRA 的唯一事实源
#
# 职责：把「0.0.4 的 UKUI 取哪一代、每个组件钉在哪个构建」从一句口径变成
# 可复算的台账。版本证据只认基底仓库 repodata 实测（J-35），上游发布公告
# 与发行说明一律不作为版本证据；包名是否存在同样以仓库解析结果为准。
#
# 三态语义，不是二值开关：
#   present    本版闭包选中，必须进 comps 与冻结输入，nvra 逐字钉住；
#   available  基底仓库确有此包，但本版刻意不选，不得进 comps 与冻结输入；
#   absent     基底五段均无此包，任何消费侧出现即判红。
# 元包 ukui 与 ukui-desktop-environment 属 available：它们拉的是整代闭包，
# 与本版逐组件显式钉版的口径冲突，选它等于放弃可复算性。
#
# 判据（ci/gates/ukui-lock.sh）：
#   1. 核心四件 ukui-kwin / ukui-panel / ukui-session-manager /
#      ukui-control-center 必须 present，且 nvra 逐字钉住；
#      ukui 与 ukui-desktop-environment 必须 available，ukui-shell 必须 absent；
#   2. comps 与 rpms.in.yaml 中出现的每个 ukui* 包名都必须是本表 present
#      组件——不在闭包的包一旦进依赖求解，版本就不受本表约束；
#   3. 项目内部取证册逐字包含本表全部 present nvra；
#   4. 4.24 可行性成册，两条路线的取舍与顺延结论明确。
#
# 版本线的差异矩阵与复算命令、4.24 自建闭包的工作项与顺延条件，均记录在
# 项目内部取证册（docs-closed）；本表只保留可被门禁断言的结论。
# ===========================================================================
base: openEuler-24.03-LTS-SP3
arch: x86_64
segments:
  - OS
  - update
  - EPOL/main
  - EPOL/update/main
  - everything

# 0.0.4 选定路线：取基底内最高稳定组件代。4.24 自建闭包顺延，理由与代价
# 见可行性成册；这里只记录可被门禁断言的选择结果。
policy:
  route: base-highest-stable
  generation: 3.1
  deferred: ukui-4.24

components:
  - name: ukui-kwin
    state: present
    segment: EPOL/main
    nvra: ukui-kwin-0:1.0.5-8.oe2403sp3.x86_64
    role: 窗口管理器；壳层能力在本包，基底不存在 ukui-shell
  - name: ukui-panel
    state: present
    segment: EPOL/main
    nvra: ukui-panel-0:3.1.0-14.oe2403sp3.x86_64
    role: 任务栏与开始菜单宿主
  - name: ukui-session-manager
    state: present
    segment: EPOL/main
    nvra: ukui-session-manager-0:3.1.0-7.oe2403sp3.x86_64
    role: 会话管理；提供 ukui.desktop 会话入口
  - name: ukui-control-center
    state: present
    segment: EPOL/main
    nvra: ukui-control-center-0:3.1.2-33.oe2403sp3.x86_64
    role: 控制中心
  - name: ukui-settings-daemon
    state: present
    segment: EPOL/main
    nvra: ukui-settings-daemon-0:3.1.2-9.oe2403sp3.x86_64
    role: 会话级设置守护进程
  - name: ukui-greeter
    state: present
    segment: EPOL/main
    nvra: ukui-greeter-0:3.1.2-12.oe2403sp3.x86_64
    role: lightdm 登录界面；自带 95-ukui-greeter.conf
  - name: ukui-themes
    state: present
    segment: EPOL/main
    nvra: ukui-themes-0:3.0.2-2.oe2403sp3.x86_64
    role: 桌面主题
  - name: ukui-screensaver
    state: present
    segment: EPOL/main
    nvra: ukui-screensaver-0:3.1.1-8.oe2403sp3.x86_64
    role: 锁屏与屏保
  - name: ukui-menu
    state: present
    segment: EPOL/main
    nvra: ukui-menu-0:3.1.1-14.oe2403sp3.x86_64
    role: 开始菜单
  - name: ukui-sidebar
    state: present
    segment: EPOL/main
    nvra: ukui-sidebar-0:3.3.0-5.oe2403sp3.x86_64
    role: 侧边栏
  - name: ukui-notification-daemon
    state: present
    segment: EPOL/main
    nvra: ukui-notification-daemon-0:3.3.1-7.oe2403sp3.x86_64
    role: 通知守护进程
  - name: ukui-search
    state: present
    segment: EPOL/main
    nvra: ukui-search-0:3.1-5.oe2403sp3.x86_64
    role: 文件与内容搜索
  - name: ukui-media
    state: present
    segment: EPOL/main
    nvra: ukui-media-0:3.1.0-5.oe2403sp3.x86_64
    role: 音量与媒体键控制
  - name: ukui-power-manager
    state: present
    segment: EPOL/main
    nvra: ukui-power-manager-0:3.1.2-6.oe2403sp3.x86_64
    role: 电源管理
  - name: ukui-bluetooth
    state: present
    segment: EPOL/main
    nvra: ukui-bluetooth-0:1.0.3-5.oe2403sp3.x86_64
    role: 蓝牙面板
  - name: kylin-nm
    state: present
    segment: EPOL/main
    nvra: kylin-nm-0:3.1.1-5.oe2403sp3.x86_64
    role: 网络状态托盘与控制中心网络模块（libnetconnect/libwlanconnect/libmobilehotspot）
    reason: ukui-panel 的 statusnotifier 白名单按名等待 kylin-nm，面板与控制中心都不声明这条依赖；缺席时右下角网络图标消失、控制中心无网络入口，而无线本身正常。包名不带 ukui 前缀，靠桌面命名空间过滤会漏判。硬依赖 network-manager-applet 与 libappindicator-gtk3 只在 everything 段，compose 由该段补齐，装机后不随四段仓库升级
  - name: ukui-clock
    state: present
    segment: EPOL/main
    nvra: ukui-clock-0:3.1.3-3.oe2403sp3.x86_64
    role: 时钟与闹钟
  - name: ukui-notebook
    state: present
    segment: EPOL/main
    nvra: ukui-notebook-0:3.1.1-1.oe2403sp3.x86_64
    role: 便签
  - name: ukui-system-monitor
    state: present
    segment: EPOL/main
    nvra: ukui-system-monitor-0:3.1.2-5.oe2403sp3.x86_64
    role: 系统监视器
  - name: ukui-window-switch
    state: present
    segment: EPOL/main
    nvra: ukui-window-switch-0:3.1.0-2.oe2403sp3.x86_64
    role: 窗口切换
  - name: ukui-biometric-manager
    state: present
    segment: EPOL/main
    nvra: ukui-biometric-manager-0:3.1.2-5.oe2403sp3.x86_64
    role: 生物识别管理前端（扩展组）
  - name: libpam-biometric
    state: present
    segment: EPOL/main
    nvra: libpam-biometric-0:1.2.4-2.oe2403sp3.x86_64
    role: 生物识别 PAM 认证后端（扩展组）；ukui-biometric-auth 源包不打同名二进制
  - name: ukui-polkit
    state: present
    segment: EPOL/main
    nvra: ukui-polkit-0:1.2.4-2.oe2403sp3.x86_64
    role: polkit 认证代理
  - name: ukui-interface
    state: present
    segment: EPOL/main
    nvra: ukui-interface-0:1.0.3-3.oe2403sp3.x86_64
    role: 桌面设置接口库
  - name: libqt5-ukui-style1
    state: present
    segment: EPOL/main
    nvra: libqt5-ukui-style1-0:3.1.4-2.oe2403sp3.x86_64
    role: UKUI 的 Qt 风格库，ukui-panel 与 ukui-kwin 运行时按名加载
    reason: 上述包均不声明该依赖，闭包求解不会带入；缺失时面板在 CustomStyle 构造期 SIGSEGV，整个桌面崩溃。包名不带 ukui 前缀，只看命名空间会漏判
  - name: qt5-ukui-platformtheme
    state: present
    segment: EPOL/main
    nvra: qt5-ukui-platformtheme-0:3.1.4-2.oe2403sp3.x86_64
    role: UKUI 的 Qt 平台主题插件，ukui-session 以 QT_QPA_PLATFORMTHEME=ukui 按名加载
    reason: ukui-session 未声明该依赖，求解不会带入；缺席时 Qt 回退 hicolor，系统图标主题整体失效（桌面无图标、控制中心黑块）。包名不带 ukui 前缀，只看命名空间会漏判；硬依赖 qt5-styles-ukui 由求解带入，不另登记
  - name: ukui-desktop-environment
    state: available
    segment: EPOL/main
    nvra: ukui-desktop-environment-0:2.0.2-20.oe2403sp3.noarch
    role: 上游发行套件元包；基底有，本版不选
    reason: 元包拉整代闭包，与逐组件钉版冲突；NVRA 仅作存在性取证
  - name: ukui
    state: available
    segment: EPOL/main
    nvra: ukui-0:2.0.2-20.oe2403sp3.noarch
    role: 上游元包；基底有，本版不选
    reason: 元包拉整代闭包，与逐组件钉版冲突；NVRA 仅作存在性取证
  - name: ukui-shell
    state: absent
    segment: 五段均无
    role: 壳层独立包；UK-02 取证对象
    reason: 基底壳层由 ukui-kwin 承担，无独立 ukui-shell 包
