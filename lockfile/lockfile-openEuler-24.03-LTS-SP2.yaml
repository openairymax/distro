# 状态: 占位模板。packages 段由 lockfile/gen-lockfile.sh 在冻结环境生成后
#       回填，禁止手工编造 EVR（N-E:V-R 以仓库实际 repodata 为唯一事实）。
#
# 格式: rpm-lockfile-2024（konflux schema）
# 滚动流程: 见同目录 README.md
# ===========================================================================
document: rpm-lockfile-2024
version: 1
data:
  arch: x86_64
  # 内容源：生成时以 airymax-os.repo + openEuler 三个仓库定义为准
  contentOrigin:
    repofiles:
      - airymax-os.repo
  # TODO: 由 gen-lockfile.sh 回填；预期覆盖：
  #   - @airymax-workstation 环境闭包（UKUI 桌面组 + 系统层）
  #   - kernel（6.6-airymax.n，来自 airymax-os 仓库）
  #   - 安装器运行所需最小工具集
  packages: []
