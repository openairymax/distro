# ===========================================================================
# 99-airymax-hostname.conf — 产品主机名的运行时来源
#
# 部署：随 airymaxos-release 安装为 /etc/sysctl.d/99-airymax-hostname.conf。
# 由 systemd-sysctl.service 在 sysinit 阶段应用，每次开机生效。
#
# 为什么需要这一层：/etc/hostname 里的产品名是 AIRYMAX_PC（下划线是产品
# 口径）。systemd 在启动早期读该文件时先跑 hostname_cleanup()，按 RFC 1123
# 只保留字母、数字与连字符，下划线被静默删除——静态主机名因此变成
# AIRYMAXPC。B50 实测（内核 6.6.157-alk，SELinux Enforcing）：
#   hostname          -> AIRYMAXPC      （清理后的结果）
#   hostnamectl       -> Static: AIRYMAXPC / Transient: AIRYMAXPC
# 而 sysctl -w kernel.hostname=AIRYMAX_PC 之后 transient 变为 AIRYMAX_PC，
# 证明内核 sethostname(2) 本身只校验长度（64 字节），不做字符过滤。
#
# 为什么用 sysctl 而不用 hostnamectl set-hostname：后者同样经 systemd 的
# 清理路径，写回静态名后依旧被删下划线；只有直接写内核的这条路径能保住
# 产品名。systemd 的 hostname_setup() 在 PID1 进入主循环之前执行，
# systemd-sysctl.service 是其后的单元，故本文件的值总在最后落定。
#
# 副作用与边界：hostnamectl 的 Static 字段仍是清理后的 AIRYMAXPC，这是
# systemd 的已知约束，不影响 hostname(1)、shell 提示符、DHCP 上报与
# 验收判定（T8 读 /etc/hostname，现场命令读内核名，两者都是产品名）。
# 手工执行 hostnamectl set-hostname 会把内核名改回清理结果，需要重启或
# 重新应用本文件才能恢复。
# ===========================================================================
kernel.hostname = AIRYMAX_PC
