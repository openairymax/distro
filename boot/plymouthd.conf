# ===========================================================================
# plymouthd — AirymaxOS 启动画面
#
# 部署：airymaxos-release 安装到 /etc/plymouth/plymouthd.conf。
#
# 只在 bootloader 行带 rhgb 时生效（kickstart 的 bootloader 行）。上游
# 默认主题是 text：即使图形后端可用，屏幕上也只是文字加进度点，与逐行
# 滚动的内核日志没有观感差别。这里改用 tribar（openEuler 随 plymouth
# 打包的图形主题），并把 ShowDelay 从默认的 5 秒压到 0——那 5 秒黑屏
# 正是「机器是不是卡住了」的来源。
#
# 主题缺失或渲染后端不可用时 plymouth 自己回落到 text：这份配置写错只
# 会退回旧观感，不会阻断启动，因此不需要在安装期做可用性探测。
# ===========================================================================

[Daemon]
Theme=tribar
ShowDelay=0
